# SonarCloud configuration, kept in the repo rather than in the dashboard so a
# change to what the quality gate measures is reviewable in a PR like any other
# change. Nothing here weakens the security, reliability or maintainability
# ratings — those stay at A and are the reason the gate is worth having.

# Copy-paste detection only. These two trees are excluded from DUPLICATION
# analysis and from nothing else: they are still scanned for bugs, security
# issues and code smells.
#
# - `alembic/versions/**` is hand-written DDL. Migrations repeat by
#   construction — the same `batch_alter_table` preamble, the same naming
#   convention, the same column definitions restated in `downgrade()`. `DB-15`
#   and `DB-16` require exactly that shape, so CPD is measuring compliance with
#   the standard and reporting it as a defect.
#
# - `backend/tests/**` states behaviour, and two tests that set up similar
#   worlds should look similar. Collapsing assertions into shared helpers to
#   satisfy a duplication metric makes a failing test harder to read at the
#   moment you most need to read it. Genuine repetition inside a test file is
#   still worth extracting — the mark-and-finalize helper in `test_mocks.py`
#   came out of this gate flagging it — but that is a judgement per case, not a
#   percentage.
#
# Application code under `backend/app/**` and `frontend/src/**` is deliberately
# NOT excluded. This gate has already earned its place there: it flagged the
# attempt-opening block duplicated across the homework, past-paper and mock
# routers, and those three copies had drifted into a live bug.
sonar.cpd.exclusions=backend/alembic/versions/**,backend/tests/**
