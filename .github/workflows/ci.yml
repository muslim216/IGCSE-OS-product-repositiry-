# The only automated gate on a change reaching production.
#
# The default branch deploys the moment something merges into it — Render builds
# the API and Vercel the frontend, with no further approval step. Until this file
# existed nothing ran on a pull request at all, so "the tests pass" meant "someone
# remembered to run them". That is RISK-2 in docs/governance/risk-register.md.
#
# Four jobs, deliberately separate so a red run names the failure rather than
# just failing: static analysis, application tests, migration reversibility, and
# the frontend build (which is the only type check anywhere in the repo).
name: CI

# Read-only by default. These jobs check out pull-request code and run it, so
# the token they inherit should not be able to write anything; a job that ever
# needs more gets its own narrower grant rather than widening this.
permissions:
  contents: read

on:
  pull_request:
  push:
    # The default branch is still literally named claude/igcse-os-planning-q8be0t
    # pending the rename to main; both are listed so the rename does not silently
    # stop CI running on the branch that deploys.
    branches:
      - main
      - claude/igcse-os-planning-q8be0t

# A second push to the same PR makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    # Its own job rather than steps bolted onto the test jobs, for the reason at
    # the top of this file: a lint break reported as "Backend tests" names the
    # wrong thing, and the first question about a red run is always which kind of
    # wrong it is. This one is also the cheapest, so it answers first.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: ruff check
        working-directory: backend
        run: python -m ruff check .

      # Separate from `check` so the failure message distinguishes "this code is
      # wrong" from "this code is unformatted". --check never writes; the fix is
      # `ruff format .` locally.
      - name: ruff format --check
        working-directory: backend
        run: python -m ruff format --check .

      - name: mypy (app.services + app.schemas)
        working-directory: backend
        run: python -m mypy app/services app/schemas

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # --max-warnings 0 because a warning nobody has to clear is a warning that
      # accumulates until the output is scrolled past rather than read. The two
      # warning-level rules here (exhaustive-deps, only-export-components) are
      # warnings to mark that they are advisory in kind, not that they are
      # optional to resolve.
      - name: eslint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      # The frontend counterpart to `ruff format --check`, and split from eslint
      # for the same reason: "this code is wrong" and "this code is unformatted"
      # are different messages. The fix is `npm run format` locally.
      - name: prettier --check
        working-directory: frontend
        run: npm run format:check

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # tests/conftest.py forces sqlite+aiosqlite:///:memory: before any app
      # module is imported, so this job needs no database service and no API key.
      - name: pytest
        run: python -m pytest -q

  migrations:
    name: Migrations up/down/up (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The test suite builds its schema from Base.metadata, never from Alembic
    # (QA-11), so without this job the 21 migrations first execute when a
    # container boots in production — and the start command is
    # `alembic upgrade head && uvicorn`, so a bad one means the API never starts
    # rather than degrading. That is RISK-3, and migration 0012 has already done
    # it once on Postgres with existing users.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: igcse
          POSTGRES_PASSWORD: igcse
          POSTGRES_DB: igcse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U igcse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # config.py rewrites the bare scheme to postgresql+asyncpg:// on the way in,
      # so this is the same URL shape a hosting provider hands out.
      DATABASE_URL: postgresql://igcse:igcse@localhost:5432/igcse
      JWT_SECRET: ci-only-secret-not-used-to-sign-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Upgrade to head
        run: python -m alembic upgrade head

      # DB-16 requires every migration to have a working downgrade, verified
      # up -> down -> up. Verifying it by hand on SQLite does not catch the
      # Postgres-specific failures, which is exactly the class that has occurred.
      - name: Downgrade to base
        run: python -m alembic downgrade base

      - name: Upgrade to head again
        run: python -m alembic upgrade head

      # The multi-worker claim tests (task 1.3, AV-82) run here rather than in
      # the `backend` job because that one forces SQLite, which silently DROPS
      # `FOR UPDATE SKIP LOCKED` — no error, no warning. Running them there
      # would exercise a query with no locking in it, pass, and prove nothing,
      # which is worse than not running them at all because the green tick
      # gets cited as evidence. This job already has a real Postgres, so it is
      # the only place they mean anything. They skip themselves on a non-
      # Postgres DATABASE_URL, so this step cannot silently no-op unnoticed.
      # The tests skip themselves on a non-Postgres URL, and a skip here would
      # be a green tick for tests that never ran — the exact failure mode the
      # module docstring warns about. So the step fails on a wrong URL, and
      # fails again if pytest reports anything skipped or uncollected.
      - name: Multi-worker job-claim tests (Postgres)
        run: |
          set -euo pipefail
          case "$DATABASE_URL" in
            postgresql*) ;;
            *) echo "::error::DATABASE_URL is not PostgreSQL; these tests would silently skip"; exit 1 ;;
          esac
          TEST_DATABASE_URL="$DATABASE_URL" python -m pytest tests/test_worker_concurrency.py -v -ra \
            | tee /tmp/worker-concurrency.log
          if grep -qE "skipped|no tests ran" /tmp/worker-concurrency.log; then
            echo "::error::concurrency tests skipped or not collected — they must actually run here"
            exit 1
          fi

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: vitest
        run: npm test

      # src/api/schema.d.ts is generated from openapi.json (task 0.8) and both
      # are committed, so nothing forces either to be regenerated when the
      # backend changes. Two checks close that: backend
      # tests/test_openapi_snapshot.py proves openapi.json still matches the
      # running app, and this one proves the TypeScript still matches
      # openapi.json. Without the pair, a stale generated file is the same
      # RISK-6 divergence as the hand-mirrored interfaces it replaced, only
      # now it looks automated. Fix a failure with `npm run generate:api`.
      - name: API types match the OpenAPI document
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts

      # `npm run build` is `tsc -b && vite build`. `npm test` does NOT type-check,
      # so this step is the only thing in the repository that ever type-checks the
      # frontend — including everything typed from the generated schema (FE-4).
      - name: Type check and build
        run: npm run build
