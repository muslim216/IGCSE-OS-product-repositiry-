version: 2
# No pip entry: the backend locks are generated by the uv command in each lock
# file's header (hashed, with an --exclude-newer cap), which Dependabot cannot
# run. A Python bump is made by editing that command and regenerating.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The locks are compiled for Python 3.11: only the digest moves here.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
