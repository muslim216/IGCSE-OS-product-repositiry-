<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>IGCSE Student OS — Architecture Map</title>
<style>
  :root {
    --bg:        #0F0F0F;
    --panel:     #161616;

    --text:      #e8e8e8;
    --muted:     #8a8a8a;

    --route:     #7bd389;
    --service:   #c792ea;
    --db:        #ffb86b;
    --external:  #ff6b9d;
    --critical:  #ff3860;
    --accent:    #f5b942;
    --accent-2:  #ff7a45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 650; white-space: nowrap; }
  header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; user-select: none;
    transition: all .12s ease;
  }
  .chip:hover { color: var(--text); border-color: #3a3a3a; }
  .chip.active { color: #111; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chip.active.crit { background: var(--critical); border-color: var(--critical); color: #fff; }
  .zoom { margin-left: auto; display: flex; gap: 6px; }
  .zoom button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .zoom button:hover { border-color: #444; }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas { flex: 1; overflow: hidden; cursor: grab; position: relative; }
  #canvas.dragging { cursor: grabbing; }
  svg { display: block; width: 100%; height: 100%; }
  #sidebar {
    width: 360px; min-width: 360px; border-left: 1px solid var(--border);
    background: var(--panel); overflow-y: auto; padding: 16px;
  }
  #sidebar h2 { font-size: 14px; margin-bottom: 4px; }
  #sidebar .path {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--accent); word-break: break-all; margin-bottom: 10px; display: block;
  }
  #sidebar .role { font-size: 13px; margin-bottom: 8px; }
  #sidebar .plain {
    font-size: 13px; color: #c9c9c9; background: var(--panel-2); border-left: 3px solid var(--client);
    padding: 8px 10px; border-radius: 0 6px 6px 0; margin-bottom: 12px;
  }
  #sidebar ul { list-style: none; }
  #sidebar li { font-size: 12px; color: var(--muted); padding: 3px 0 3px 14px; position: relative; }
  #sidebar li::before { content: "·"; position: absolute; left: 2px; color: var(--accent); }
  #sidebar .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 4px; }
  #sidebar .edge-row { font-size: 12px; padding: 2px 0; color: #bbb; }
  #sidebar .edge-row b { color: var(--text); font-weight: 600; }
  #sidebar .edge-row .lbl { color: var(--muted); }
  #sidebar .fix { color: #9fe3a9; }
  #sidebar .bug { color: #ff8ba0; }
  #sidebar .bug .ref, #sidebar .fix .ref { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--muted); }
  .finding { font-size: 12.5px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 7px; background: var(--panel-2); }
  .finding b { color: var(--accent); }
  .legend { display: grid; grid-template-columns: 16px 1fr; gap: 4px 8px; align-items: center; margin-top: 6px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; }
  .legend .ln { width: 16px; height: 0; border-top: 2.5px solid; }
  .legend span { font-size: 12px; color: var(--muted); }
  .node { cursor: pointer; }
  .node rect { transition: opacity .15s; }
  .node text { pointer-events: none; }
  .cluster-label { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .edge-label { font-size: 9.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
</style>
</head>
<body>
<header>

<script>

/* Edge geometry */
function edgePath(e) {
  const a = nodeById[e.from], b = nodeById[e.to];
  const acx = a.x + a.w / 2, bcx = b.x + b.w / 2;
  const ay = a.y + a.h / 2, by = b.y + b.h / 2;
  if (e.side === 'L') { // same-column bulge left
    const x1 = a.x, x2 = b.x, bx = Math.min(x1, x2) - 58;
    return { d: `M ${x1} ${ay} C ${bx} ${ay}, ${bx} ${by}, ${x2} ${by}`, p: [[x1, ay], [bx, ay], [bx, by], [x2, by]] };
  }
  if (e.side === 'R') { // same-column bulge right
    const x1 = a.x + a.w, x2 = b.x + b.w, bx = Math.max(x1, x2) + 58;
    return { d: `M ${x1} ${ay} C ${bx} ${ay}, ${bx} ${by}, ${x2} ${by}`, p: [[x1, ay], [bx, ay], [bx, by], [x2, by]] };
  }
  let x1, x2;
  if (e.back || bcx < acx) { x1 = a.x; x2 = b.x + b.w; } // right-to-left
  else { x1 = a.x + a.w; x2 = b.x; }
  const dx = Math.max(46, Math.abs(x2 - x1) * 0.42);
  const c1 = x1 + (x2 > x1 ? dx : -dx), c2 = x2 - (x2 > x1 ? dx : -dx);
  return { d: `M ${x1} ${ay} C ${c1} ${ay}, ${c2} ${by}, ${x2} ${by}`, p: [[x1, ay], [c1, ay], [c2, by], [x2, by]] };
}
function bezPoint(p, t) {
  const u = 1 - t;
  const x = u*u*u*p[0][0] + 3*u*u*t*p[1][0] + 3*u*t*t*p[2][0] + t*t*t*p[3][0];
  const y = u*u*u*p[0][1] + 3*u*u*t*p[1][1] + 3*u*t*t*p[2][1] + t*t*t*p[3][1];
  return [x, y];
}

/* Edges */
const gEdges = el('g'); world.appendChild(gEdges);
const edgeEls = edges.map((e, i) => {
  const g = el('g');
  const { d, p } = edgePath(e);
  const isCrit = e.kind === 'critical';
  const path = el('path', { d, fill: 'none', stroke: KIND[e.kind], 'stroke-width': isCrit ? 2.4 : 1.4, 'marker-end': `url(#arr-${e.kind})`, opacity: isCrit ? 0.95 : 0.62 });
  g.appendChild(path);
  if (e.label) {
    const t = e.lt !== undefined ? e.lt : 0.5;
    const [lx, ly] = bezPoint(p, t);
    const txt = el('text', { x: lx, y: ly - 5 + ((i % 3) - 1) * 4, fill: isCrit ? KIND.critical : '#9a9a9a', 'text-anchor': 'middle', class: 'edge-label' });
    txt.textContent = e.label;
    g.appendChild(txt);
  }
  gEdges.appendChild(g);
  return g;
});

  t2.textContent = n.sub || '';
  g.appendChild(t2);
  const fixes = FIXES[n.id] || [], bugs = KNOWN_BUGS[n.id] || [];

}

function nodeVisible(n) {
  if (activeChip === 'roadmap') return !!(FIXES[n.id] || KNOWN_BUGS[n.id]);
  if (activeChip === 'overview' || activeChip === 'all') return true; // overview curates wires, not nodes

}
function edgeVisible(e) {
  if (activeChip === 'roadmap') return false;

}

function select(id, stick) {
  if (stick) sticky = true;
  const n = nodeById[id];
  const inc = edges.filter(e => e.to === id), out = edges.filter(e => e.from === id);
  const neigh = new Set([id, ...inc.map(e => e.from), ...out.map(e => e.to)]);
  nodes.forEach(m => { nodeEls[m.id].style.opacity = neigh.has(m.id) ? 1 : 0.12; });
  edges.forEach((e, i) => { edgeEls[i].style.opacity = (e.from === id || e.to === id) ? 1 : 0.05; });

  const fixes = FIXES[id] || [], bugs = KNOWN_BUGS[id] || [];
  let h = `<h2>${esc(n.label)} <span style="color:var(--muted);font-weight:400">· ${esc(n.sub || '')}</span></h2>`;
  h += `<span class="path">${esc(n.path || '')}</span>`;
  h += `<div class="role">${esc(n.role || '')}</div>`;
  h += `<div class="plain">${esc(n.plain || '')}</div>`;
  if (n.notes && n.notes.length) {
    h += `<div class="sec">Notes</div><ul>` + n.notes.map(x => `<li>${esc(x)}</li>`).join('') + `</ul>`;
  }
  if (inc.length) {
    h += `<div class="sec">Incoming</div>` + inc.map(e => `<div class="edge-row">← <b>${esc(nodeById[e.from].label)}</b> <span class="lbl">${esc(e.label || e.kind)}</span></div>`).join('');
  }
  if (out.length) {
    h += `<div class="sec">Outgoing</div>` + out.map(e => `<div class="edge-row">→ <b>${esc(nodeById[e.to].label)}</b> <span class="lbl">${esc(e.label || e.kind)}</span></div>`).join('');
  }
  if (fixes.length) {
    h += `<div class="sec">Roadmap fixes</div>` + fixes.map(f => `<div class="edge-row fix">✔ #${f.n} — ${esc(f.t)}</div>`).join('');
  }
  if (bugs.length) {

  }
  sidebar.innerHTML = h;
}

    <div class="ln" style="border-color:var(--accent-2)"></div><span>External / infra</span>
    <div class="ln" style="border-color:var(--db)"></div><span>Database read/write</span>
    <div class="ln" style="border-color:var(--client)"></div><span>Router mounts (Show all wires)</span>
    <div class="ln" style="border-color:#5a5a5a"></div><span>Function / HTTP call</span>
  </div>
  <div class="sec">Badges</div>
  <div class="legend">
    <div class="sw" style="border-color:#2e9e4f;background:#2e9e4f"></div><span>Planned roadmap fixes touching this node</span>
    <div class="sw" style="border-color:#c22843;background:#c22843"></div><span>Known issues (cited file:line)</span>
  </div>`;
}

/* ---------------- Pan / zoom ---------------- */
const canvas = document.getElementById('canvas');
let tx = 0, ty = 0, s = 1;
const WORLD_W = 1880, WORLD_H = 1090;
function apply() { world.setAttribute('transform', `translate(${tx} ${ty}) scale(${s})`); }
function fit() {
  const r = canvas.getBoundingClientRect();
  s = Math.min(r.width / WORLD_W, r.height / WORLD_H) * 0.97;
  tx = (r.width - WORLD_W * s) / 2; ty = (r.height - WORLD_H * s) / 2;
  apply();
}
canvas.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.min(3.5, Math.max(0.2, s * factor));
  tx = mx - (mx - tx) * (ns / s); ty = my - (my - ty) * (ns / s);
  s = ns; apply();
}, { passive: false });
let drag = null;
canvas.addEventListener('mousedown', (ev) => { drag = { x: ev.clientX, y: ev.clientY, tx, ty }; canvas.classList.add('dragging'); });
window.addEventListener('mousemove', (ev) => { if (!drag) return; tx = drag.tx + ev.clientX - drag.x; ty = drag.ty + ev.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; canvas.classList.remove('dragging'); });
svg.addEventListener('click', () => clearSelect(true));
document.getElementById('zoom-fit').addEventListener('click', fit);
document.getElementById('zoom-in').addEventListener('click', () => { s = Math.min(3.5, s * 1.2); apply(); });
document.getElementById('zoom-out').addEventListener('click', () => { s = Math.max(0.2, s / 1.2); apply(); });

/* ---------------- Boot ---------------- */
syncChips();
applyFilter();
renderDefaultSidebar();
fit();
window.addEventListener('resize', fit);
</script>
