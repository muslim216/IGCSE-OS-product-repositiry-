services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: igcse
      POSTGRES_PASSWORD: igcse
      POSTGRES_DB: igcse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igcse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage, standing in for Cloudflare R2 / AWS S3
  # locally (task 1.2, AV-82). Opt-in via `--profile full`, same as `backend`
  # — plain `docker compose up -d db` (the documented default) never starts
  # it, so STORAGE_BACKEND stays "local" and needs nothing extra.
  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: igcse-dev
      MINIO_ROOT_PASSWORD: igcse-dev-secret
      # Must match S3_REGION on the backend: boto3 signs with the configured
      # region and MinIO rejects a mismatch as SignatureDoesNotMatch.
      MINIO_REGION: us-east-1
    ports:
      # Bound to loopback: these carry fixed root credentials, and an
      # unqualified "9000:9000" publishes the dev bucket to anything that can
      # reach this host on the network.
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+asyncpg://igcse:igcse@db:5432/igcse
      JWT_SECRET: dev-only-secret-change-me
      CORS_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Local disk remains the default (see the `minio` service comment).
      # Set STORAGE_BACKEND=s3 to exercise the object-storage path locally —
      # the bucket must exist first: `docker compose --profile full up -d
      # minio` then create it once via the mc client or the console at
      # :9001. Real deployments point these at R2/S3 instead; MinIO is
      # dev/CI-only and is never reachable from outside this compose network.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-avora-dev}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Matches MINIO_REGION above. Not "auto" — that is an R2-ism, and MinIO
      # signs against its own configured region.
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-igcse-dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-igcse-dev-secret}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        # Only meaningful under STORAGE_BACKEND=s3, but harmless otherwise and
        # cheaper than debugging a first upload that raced MinIO's startup.
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
  miniodata:
