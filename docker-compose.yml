services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: igcse
      POSTGRES_PASSWORD: igcse
      POSTGRES_DB: igcse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igcse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql+asyncpg://igcse:igcse@db:5432/igcse
      JWT_SECRET: dev-only-secret-change-me
      CORS_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
