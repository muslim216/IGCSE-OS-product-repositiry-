# Render blueprint: one Postgres database and the FastAPI backend. The frontend
# is served by Vercel alone (frontend/vercel.json) and is deliberately not
# provisioned here — a second copy of the app on another origin would not match
# GOOGLE_REDIRECT_URI, so Classroom would silently fail for anyone who reached it.
# Deploy by connecting this repo at https://dashboard.render.com ("New" ->
# "Blueprint"). Values marked `sync: false` are not stored in the repo and must
# be filled in from the Render dashboard — see README "Deployment".
#
# THE NAMES BELOW ARE IDENTITIES, NOT LABELS. Render matches blueprint entries
# to existing resources by `name`. Renaming one here does not rename anything:
# it provisions a *new* empty resource and orphans the old one — a new empty
# Postgres, a new empty uploads disk, a new hostname the frontend does not
# proxy to. That is why the Avora rename (task 0.6, AV-4) deliberately stops at
# these five values and at the hostname in frontend/vercel.json. Renaming the
# deployed resources is an owner-run migration in the Render dashboard, taken
# together with the Vercel project rename and the GitHub repo rename (E10) —
# not a commit.
databases:
  - name: igcse-os-db
    plan: basic-256mb

services:
  - type: web
    name: igcse-os-api
    runtime: docker
    rootDir: backend
    plan: starter
    # Without this Render never probes the service at all: a deploy is marked
    # live without one successful request, and an instance whose uvicorn has
    # wedged keeps taking traffic. Points at the shallow liveness endpoint on
    # purpose — /api/v1/health/ready also checks the database and the job
    # worker, and pointing a restart trigger at those would turn a brief
    # database blip into a restart loop. Deep state is for a human to read, not
    # for the platform to react to.
    healthCheckPath: /api/v1/health
    # Uploaded booklets, mark schemes and submissions are written to the local
    # filesystem (services/storage.py), and DB rows store paths relative to
    # UPLOAD_DIR. Without a persistent disk every deploy replaces the container
    # and silently orphans those rows, so the files must live outside it.
    # A service with a disk runs a single instance — fine here, and the job
    # worker claims with FOR UPDATE SKIP LOCKED so scaling out stays safe if
    # storage later moves to S3 and the disk goes away.
    disk:
      name: igcse-os-uploads
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: igcse-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /data/uploads

      # --- Object storage (task 1.2, AV-82) ------------------------------
      # STORAGE_BACKEND stays "local" here deliberately: the persistent disk
      # above is still what's live. Flipping to "s3" is a separate, deliberate
      # cutover once a real bucket exists (docs/av-82-architecture-impact-
      # report.md recommends Cloudflare R2) — it is not automatic from this
      # key existing. The S3_* values are placeholders until that day.
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # --- AI providers -------------------------------------------------
      # Anthropic serves chat, reports, readiness synthesis and class briefs.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Gemini serves the bulk document work: marking, question extraction and
      # syllabus extraction. Without this key those three surfaces fail with a
      # clear "not configured" error while the rest of the app keeps working —
      # but that is the core homework pipeline, so set it before going live.
      - key: GEMINI_API_KEY
        sync: false
      # The default in config.py is an owner-supplied placeholder. Set the real
      # model id your account has access to rather than inheriting it.
      - key: GEMINI_MODEL
        sync: false

      # Per-surface routing. Restated here (rather than left to config.py's
      # defaults) so these three can be flipped to `anthropic` from the
      # dashboard to stage without a Gemini key, with no code change.
      - key: AI_MARKING_PROVIDER
        value: gemini
      - key: AI_EXTRACTION_PROVIDER
        value: gemini
      - key: AI_SYLLABUS_PROVIDER
        value: gemini

      # Per-token prices for ai_usage_events.cost_usd, as JSON, keyed by model
      # id. Unset means calls record an unknown cost and report as
      # unpriced_call_count — never a fabricated $0 (AI-17).
      #
      # The ids in backend/.env.example are AV-124's targets — claude-opus-5 and
      # claude-sonnet-5 — priced ahead of the routing flip (task 3.2). Read the
      # three PROVIDER lines above before expecting a total: marking, extraction
      # and syllabus still route to Gemini here, and gemini-2.5-pro is not in
      # that table, so those calls stay unpriced until the flip lands. That is
      # the intended reading of the number, not a gap to paper over with a
      # guessed Gemini rate.
      #
      # Deliberately `sync: false` — a price is not a fact about this codebase,
      # it is a fact about the account's contract on the day it is read, and it
      # moves without a commit. Paste the current value from backend/.env.example
      # into the dashboard, which is also where you correct it when rates change.
      # model_pricing() is @lru_cache'd, so a changed value needs a restart, and
      # nothing is backfilled: rows already written keep cost_usd = NULL. Verify
      # GET /api/v1/ai-usage/analytics reports money afterwards — malformed JSON
      # is ignored rather than raised, so a typo fails silently.
      - key: AI_MODEL_PRICING
        sync: false

      # --- Readiness v2 -------------------------------------------------
      # Kill switch, not a shadow flag: false stops v2 runs being enqueued and
      # readiness falls back to the v1 engine instead of breaking.
      - key: READINESS_V2_SHADOW_ENABLED
        value: "true"
      - key: READINESS_V2_COALESCE_SECONDS
        value: "600"

      # --- Google Classroom ---------------------------------------------
      # Both unset -> the feature reports "not configured" and the app runs
      # fine without it. The redirect URI must match an authorized redirect
      # URI on the Google Cloud OAuth client exactly, frontend origin included.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The full callback URL — origin *and* path — not just the origin. Google
      # redirects the browser here and the backend replays the same value in the
      # token exchange, so the whole string must be registered verbatim as an
      # authorized redirect URI on the Google OAuth client; a bare origin there
      # will not match. The origin is Vercel's because that is the page the
      # tutor's browser is on when it lands on the callback. Change this only
      # when the frontend's callback URL changes — a new backend URL is a
      # frontend/vercel.json rewrite change and does not touch this value.
      - key: GOOGLE_REDIRECT_URI
        value: https://igcse-os-product-repositiry.vercel.app/settings/classroom/callback
      # Encrypts stored Google refresh tokens at rest. Falls back to a key
      # derived from JWT_SECRET when unset; a dedicated value is preferred so
      # rotating one secret does not invalidate the other.
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        generateValue: true

      # --- Web ----------------------------------------------------------
      # The Vercel frontend does not need CORS while it proxies /api/*
      # server-side (the browser sees one origin); this only matters for a
      # cross-origin VITE_API_BASE_URL build, and an origin missing here fails
      # at the browser with no server-side trace.
      - key: CORS_ORIGINS
        value: https://igcse-os-product-repositiry.vercel.app
      # The refresh cookie is HTTPS-only. Never set false on a real deploy.
      - key: REFRESH_COOKIE_SECURE
        value: "true"
