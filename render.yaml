# Render blueprint: Postgres database + the FastAPI backend. The frontend
# deploys separately to Vercel (see frontend/vercel.json). Deploy by
# connecting this repo at https://dashboard.render.com ("New" -> "Blueprint")
# and setting ANTHROPIC_API_KEY when prompted.

databases:
  - name: igcse-os-db
    plan: free

services:
  - type: web
    name: igcse-os-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: igcse-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://igcse-os.vercel.app
