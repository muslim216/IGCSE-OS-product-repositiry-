[project]
name = "avora-backend"
version = "0.1.0"
description = "Avora — API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    # S3-compatible object storage (AWS S3, Cloudflare R2, MinIO). Imported
    # lazily inside S3Backend, so a local-storage deployment never loads it.
    "boto3>=1.34",
    # Rate-limit counters shared across API instances. Imported lazily inside
    # RedisWindowStore, so a deployment with no REDIS_URL never loads it.
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Matches the function-scoped default pytest-asyncio has always used. Called
# out explicitly because test_worker_concurrency.py opts a handful of tests
# into `loop_scope="module"` instead — without this default pinned, a
# pytest-asyncio version bump silently changing the fallback would make an
# unrelated module's fixtures resolve to a different loop than its tests,
# producing the exact asyncpg "another operation is in progress" failure
# task 1.3 (AV-82) exists to avoid.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
# 100, not the 88 default, because that is what this codebase already is: the
# 99th percentile line is 99 characters. Adopting 88 would reformat 109 of 145
# files to satisfy a number nothing here was ever written to, which is churn
# wearing a standard's clothes.
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Chosen to catch bugs, not to enforce taste. A rule set that reports a thousand
# things is one nobody ever gets to zero, and a linter that is permanently red
# tells you nothing on the day it goes red for a real reason.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes — undefined names, unused imports, the real bug-catcher
    "I",     # import sorting
    "B",     # bugbear — mutable defaults, unchained raises
    "C4",    # comprehension correctness
    "SIM",   # simplifiable constructs
    "ASYNC", # blocking calls inside async — this codebase is async end to end
    "UP",    # pyupgrade
    # Seven `# noqa: BLE001` comments were already written across the codebase
    # for a linter that had never been configured, so they suppressed nothing and
    # documented a decision no tool was checking. Enabling the rule makes them
    # mean what they say, and makes the next blind `except Exception` an explicit
    # choice rather than an accident.
    "BLE",
]
ignore = [
    # The formatter owns line length. Keeping the lint rule as well means
    # fighting it over the long strings and URLs in comments it cannot split,
    # which is a fight the formatter always wins.
    "E501",
    # `timezone.utc` -> `datetime.UTC`. Identical object, 65 call sites, zero
    # behaviour change: pure diff.
    "UP017",
    # `(str, Enum)` -> `StrEnum` is NOT equivalent — it changes `str(Member)`
    # from "Class.member" to "member". These enums are serialized, so an
    # autofix here could quietly alter what goes over the wire and into the
    # database. Not a formatting question.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# pytest's fixture idiom is to import a fixture into the module and then name it
# as a test parameter, which is by definition a redefinition. F811 is right
# about the shape and wrong about the meaning, 30 times.
"tests/*" = ["F811"]
# Migrations are a historical record. They are formatted and import-sorted like
# everything else, but a merged migration is never edited to satisfy a new rule.
"alembic/versions/*" = ["E402"]
# The seed scripts are one-shot CLI entry points (`python -m seed.demo`) that do
# their work and exit. ASYNC240 is right that a blocking read stalls the event
# loop, and here there is nothing else on the loop to stall — no request is
# waiting. Rewriting them against anyio would add a dependency to buy nothing.
"seed/*" = ["ASYNC230", "ASYNC240"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

# Static typing is introduced gradually (task 0.8, AV-79). We check the
# service boundaries first and broaden the scope as modules are annotated.
[tool.mypy]
python_version = "3.11"
packages = ["app.services", "app.schemas"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
no_implicit_optional = true
