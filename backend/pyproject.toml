[project]
name = "igcse-os-backend"
version = "0.1.0"
description = "IGCSE Student Operating System — API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "anthropic>=0.40",
    # Students photograph work on iPhones, which produce HEIC; these transcode
    # it to JPEG on upload since the Anthropic image API won't take HEIC.
    "pillow>=10.3",
    "pillow-heif>=0.16",
    # Google Classroom import. httpx is used directly rather than
    # google-api-python-client, which is sync-only and would block the worker.
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }
